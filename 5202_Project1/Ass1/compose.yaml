services:
  spark-notebook:
    image: monashfit/fit5202-pyspark:latest
    container_name: fit5202-ass1
    working_dir: /home/student
    command:
      - jupyter
      - notebook
      - --ip=0.0.0.0
      - --port=5202
      - --no-browser
    environment:
      TZ: Australia/Melbourne
    ports:
      - "5202:5202"
      - "4040:4040"
    volumes:
      - ./:/home/student
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; connection = socket.create_connection(('127.0.0.1', 5202), 2); connection.close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fit5202

networks:
  fit5202:
    external: true
